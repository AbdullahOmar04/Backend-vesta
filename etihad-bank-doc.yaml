openapi: 3.0.1
info:
  title: Identity API
  description: >
    This API allows to partner's application to manage users and their identity
  version: '1'
servers:
  - url: https://api.developer.bankaletihad.com/api/v1/tppa
tags:
  - name: authentication
  - name: user-management
  - name: other
  - name: rsa

paths:
  /rsa/key:
    get:
      tags:
        - rsa
      description: The method returns RSA Public Key
      operationId: Get-RSA-public-key
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rsaPublicKey'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "401003"
                Message: The access token provided is expired, revoked, malformed, or invalid for other reasons
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "403004"
                Message: Resource owner authentication failed
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "500001"
                Message: Internal Server Error
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"
  /certificates/{clientId}:
