    items:
      required:
        - e
        - kid
        - kty
        - 'n'
        - use
        - x5c
        - x5t
        - x5t#S256
      type: object
      properties:
        kid:
          title: (Key ID) Parameter
          type: string
          description: >
            The "kid" (key ID) parameter is used to match a specific key.  This
            is used, for instance, to choose among a set of keys within a JWK
            Set during key rollover.  The structure of the "kid" value is
            unspecified.  When "kid" values are used within a JWK Set, different
            keys within the JWK Set SHOULD use distinct "kid" values.  (One
            example in which different keys might use the same "kid" value is if
            they have different "kty" (key type) values but are considered to be
            equivalent alternatives by the application using them.)  The "kid"
            value is a case-sensitive string.  Use of this member is OPTIONAL.
            When used with JWS or JWE, the "kid" value is used to match a JWS or
            JWE "kid" Header Parameter value.
        kty:
          title: (Key Type) Parameter
          type: string
          description: >
            The "kty" (key type) parameter identifies the cryptographic
            algorithm family used with the key, such as "RSA" or "EC".  "kty" values
            should either be registered in the IANA "JSON Web Key Types" registry
            established by [JWA] or be a value that contains a Collision-Resistant Name.
            The "kty" value is a case-sensitive string.
            This member MUST be present in a JWK.
        alg:
          title: (Algorithm) Parameter
          type: string
          description: >
            The "alg" (algorithm) parameter identifies the algorithm intended
            for use with the key.  The values used should either be registered in
            the IANA "JSON Web Signature and Encryption Algorithms" registry
            established by [JWA] or be a value that contains a Collision-
            Resistant Name.  The "alg" value is a case-sensitive ASCII string.
            Use of this member is OPTIONAL.
        use:
          title: (Public Key Use) Parameter
          type: string
          description: >
            The "use" (public key use) parameter identifies the intended use of
            the public key.  The "use" parameter is employed to indicate whether
            a public key is used for encrypting data or verifying the signature
            on data.
            When a key is used to wrap another key and a public key use
            designation for the first key is desired, the "enc" (encryption) key
            use value is used, since key wrapping is a kind of encryption.  The
            "enc" value is also to be used for public keys used for key
            agreement operations.
          enum:
            - sig
            - enc
        'n':
          title: RSA key values
          type: string
          description: RSA key values
        e:
          title: RSA key values
          type: string
          description: RSA key values
        x5c:
          title: (X.509 Certificate Chain) Parameter
          type: array
          description: >
            The "x5c" (X.509 certificate chain) parameter contains a chain of
            one or more PKIX certificates [RFC5280].  The certificate chain is
            represented as a JSON array of certificate value strings.  Each
            string in the array is a base64-encoded (Section 4 of [RFC4648] --
            not base64url-encoded) DER [ITU.X690.1994] PKIX certificate value.
            The PKIX certificate containing the key value MUST be the first
            certificate.  This MAY be followed by additional certificates, with
            each subsequent certificate being the one used to certify the
            previous one.  The key in the first certificate MUST match the
            public key represented by other members of the JWK.
            Use of this member is OPTIONAL.
          items:
            type: string
        x5t:
          title: (X.509 Certificate SHA-1 Thumbprint) Parameter
          type: string
          description: |
            The "x5t" (X.509 certificate SHA-1 thumbprint) parameter is a
            base64url-encoded SHA-1 thumbprint (a.k.a. digest) of the DER
            encoding of an X.509 certificate [RFC5280].  Note that certificate
            thumbprints are also sometimes known as certificate fingerprints.
            The key in the certificate MUST match the public key represented by
            other members of the JWK.  Use of this member is OPTIONAL.
        x5t#S256:
          title: (X.509 Certificate SHA-256 Thumbprint) Parameter
          type: string
          description: |
            The "x5t#S256" (X.509 certificate SHA-256 thumbprint) parameter is a
            base64url-encoded SHA-256 thumbprint (a.k.a. digest) of the DER
            encoding of an X.509 certificate [RFC5280].  Note that certificate
            thumbprints are also sometimes known as certificate fingerprints.
            The key in the certificate MUST match the public key represented by
            other members of the JWK.  Use of this member is OPTIONAL.
      description: https://www.rfc-editor.org/rfc/rfc7517#page-5

    certificateRequest:
      required:
