      description: Retrieves the public certificate that can be used to validate access tokens
      tags:
        - authentication
      operationId: get-certificate
      parameters:
        - name: clientId
          in: path
          required: true
          description: Supply the unique client id of the application
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/certificates'
              example:
                keys:
                  - kid: fmjWqMM_5PkqGZCd8eL2JTFhs_DiVZAAI9MGTCMDlhc
