components:
  schemas:
    certificates:
      required:
        - keys
      type: object
      description: Array of public keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/items'

    userCreation:
      required:
        - Email
        - Password
        - Username
      type: object
      properties:
        Email:
          maxLength: 255
          minLength: 3
          type: string
          description: Email of the application user
        Username:
          maxLength: 255
          minLength: 1
          type: string
          description: Username of the application user
        Password:
          maxLength: 255
          minLength: 8
          type: string
          description: Password of the application user
        FirstName:
          maxLength: 255
          minLength: 1
          type: string
          description: First name of the application user
        LastName:
          maxLength: 255
          minLength: 1
          type: string
          description: Last name of the application user
        PhoneNumber:
          maxLength: 16
          minLength: 4
          pattern: ^\+[1-9][0-9]*$
          type: string
          description: >-
            Phone number of the application user. Should start from a + (plus),
            no zero as a first digit is allowed.

    userWithId:
      required:
        - Email
        - FirstName
        - Id
        - LastName
        - PhoneNumber
        - Username
      type: object
      properties:
        Username:
          maxLength: 255
          minLength: 1
          type: string
          description: Username of the application user
        Id:
          maxLength: 36
          minLength: 36
          type: string
          description: Id of the application user
        PhoneNumber:
          maxLength: 16
          minLength: 4
          type: string
          description: Phone number of the application user
        Email:
          maxLength: 255
          minLength: 3
          type: string
          description: Email of the application user
        LastName:
          maxLength: 255
          minLength: 1
          type: string
          description: Last name of the application user
        FirstName:
          maxLength: 255
          minLength: 1
          type: string
          description: First name of the application user

    error:
      required:
        - Code
        - Message
      type: object
      properties:
        Code:
          type: string
          description: Error code
        Message:
          type: string
          description: Human readable error description
        DateTime:
          type: string
          description: Timestamp indicating when error has occured
          format: date-time-only
        RequestId:
          type: string
          description: Request correlation id received in the request

    token_error:
      required:
        - error
        - error_message
      type: object
      properties:
        error:
          type: string
          description: Error identificator
        error_message:
          type: string
          description: Human readable error description

    realm_not_found_error:
      required:
        - error
      type: object
      properties:
        error:
          type: string
          description: Error message

    changePassword:
      required:
        - CurrentPassword
        - Password
      type: object
      properties:
        CurrentPassword:
          maxLength: 255
          minLength: 8
          type: string
          description: Current password of the application user
        Password:
          maxLength: 255
          minLength: 8
          type: string
          description: New password of the application user

    resetPasswordRequest:
      required:
        - Email
      type: object
      properties:
        Email:
          maxLength: 255
          minLength: 3
          type: string
          description: Email of the application user
