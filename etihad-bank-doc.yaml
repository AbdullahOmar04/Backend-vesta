                    x5t#S256: w2zMdyEzSDNJHeCA4mI9RV_G9pYfrfEHrEFMoSeXqdk
                  - kid: ybOz9u02PDq34r0LWxy8YuMINDeGzvVQ-t-KAhshjQk
                    kty: RSA
                    alg: RSA-OAEP
                    use: enc
                    'n': >-
                      p3EXXgWxQXXhFfjgviyYuFmRzMwL5Kw0DNKMEGEvpQCKZkY070U1Twg5p5xKzJ8TeYbVFIyF8Jv0LxSJl35T97m5hFitkHe40QDGcoZlhwhYx118RgRz8XwBBadtjwi3dNUErjn63pphB3xUdxQpjZRtjqQEHe5zgWECJqEC7OHqRdEH6yU21_KPPC-P5KA05_X5v0Zudf0TtLy8PyCUFZeg2SGlLi2ggJVSch6zZt5PdbmkZmtJPfSOGEcdsUZKWANZGk-y7gaJa4Fgf27Ti_B1xrzOieTxDpOEdygdr16HC0bYMrqq9RZ4Z28cIabGX9RGOFatUMIGgjygLTf1zw
                    e: AQAB
                    x5c:
                      - >-
                        
                    x5t: n34-gzqZ0kKdr0t1RpRHXTbQXBo
                    x5t#S256: TtxvYbxObSCAWOay7g8pmek5X4Jt897eUSyVAsj_i9A

  /users:
    get:
      description: Retrieves a list of application users
      tags:
        - user-management
      operationId: list-all-users
      parameters:
        - name: pageNumber
          in: query
          description: |
            The number of page
          schema:
            minimum: 1
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: |
            The number of items for page
          schema:
            minimum: 10
            type: integer
            default: 50
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/userWithId'
              example:
                Username: john_wick
                Id: eb7b5883-760e-4457-8337-db8c8d9675f2
                PhoneNumber: "+123456789012"
                Email: john.wick@finto.io
                LastName: Wick
                FirstName: John

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "401003"
                Message: The access token provided is expired, revoked, malformed, or invalid for other reasons
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "403004"
                Message: Resource owner authentication failed
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "500001"
                Message: Internal Server Error
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

      security:
        - bearerAuth: []
    post:
      description: Creates a new user of the application
      tags:
        - user-management
      operationId: create-a-user
      parameters:
        - name: Idempotency-key
          in: header
          description: >
            Expected value in UUID format. UUIDs are written in 5 groups of
            hexadecimal digits separated by hyphens.


            The unique value should be specified on each new request to API. If
            you are uncertain about the execution result of the recently made
            request, you may repeat the request with the same content and the
            same idempotency key, it should give you the same response as it
            should have been for the previous request, but without actual
            request execution.


            It can be useful if you did not get a response to your request at
            all or received the timeout error.
          required: true
          schema:
            maxLength: 36
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCreation'
            example:
              Email: john.wick@finto.io
              Username: john_wick
              Password: VERY_str0ng_p@ssword
              FirstName: John
              LastName: Wick
              PhoneNumber: "+123456789012"

      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userWithId'
              example:
                Username: john_wick
                Id: eb7b5883-760e-4457-8337-db8c8d9675f2
                PhoneNumber: "+123456789012"
                Email: john.wick@finto.io
                LastName: Wick
                FirstName: John

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "400001"
                Message: '{field} has an invalid value'
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "401003"
                Message: The access token provided is expired, revoked, malformed, or invalid for other reasons
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "403004"
                Message: Resource owner authentication failed
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '500':
