        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/tokenRequest'
            example:
              - grant_type: client_credentials
                client_id: 7b7b5883-760e-4457-8337-4b8c8d9675f2
                username: 7b7b5883-760e-4457-8337-4b8c8d9675f2
                password: eff43721-ca1d-42c1-a103-82cf6aa43373
                scope: partner-subscription-management
              - grant_type: password
                client_id: 7b7b5883-760e-4457-8337-4b8c8d9675f2
                username: john_wick
                password: VERY_str0ng_p@ssword
                scope: identity
              - grant_type: refresh_token
                client_id: 7b7b5883-760e-4457-8337-4b8c8d9675f2
                refresh_token: 6dfedWz6RtpS5Rt7Y6CJBLw6kqI
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponse'
              example:
                access_token: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0..
                token_type: Bearer
                expires_in: 3599
                refresh_token: 6dfedWz6RtpS5Rt7Y6CJBLw6kqI
                scope: identity

        '400':
          description: Bad request
