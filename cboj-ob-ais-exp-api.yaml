openapi: "3.0.0"
info:
  version: 1.0.0
  title: OpenAPI - AIS
  description: Account Information Services

tags:
  - name: Accounts
    description: Account Services 
  - name: Beneficiaries
    description: Beneficiaries Services
  - name: Balances
    description: Balances Services
  - name: Transactions
    description: Transactions Services
  - name: Standing Orders & Scheduled Payments
    description: Standing Orders & Scheduled Payments Services
  - name: Client (TPP) API
    description: Client & user token management
  - name: AisConsent
    description: List of APIs for consent management

paths:
  '/account-access-consents':
    post:
      tags:
        - Client (TPP) API
      summary: Creates a new AIS consent based on the input transaction date range and permissions.
      security:
        - oAuth2ClientCredentials: [accounts]
      operationId: createAisConsent
      requestBody:
        description: Consent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAisConsentRequest'
        required: true
      responses:
        '201':
          description: Successful completion of operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConsentResponse'
        '400':
          $ref: '#/components/responses/ciamErrorResponse'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_invalid_token'
                  - $ref: '#/components/schemas/ciam_error_response'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_client_error'
                  - $ref: '#/components/schemas/ciam_error_response'
        # '404':
        #   $ref: '#/components/responses/ciamErrorResponse'
        # '405':
        #   $ref: '#/components/responses/ciamErrorResponse'
        # '406':
        #   $ref: '#/components/responses/ciamErrorResponse'
        '408':
          $ref: '#/components/responses/ciamErrorResponse'
        '500':
          $ref: '#/components/responses/ciamErrorResponse'
  
  '/account-access-consents/{consentRef}':
    get:
      tags:
        - AisConsent
      summary: Returns information about the AIS consent using an external consent identifier.
      security:
        - oAuth2ClientCredentials: [accounts]
      operationId: getAisConsent
      parameters:
        - name: consentRef
          in: path
          description: AIS consent external identifier.
          required: true
          schema:
            type: string
            format: uuid
            example: d071de9d-c794-4077-9a6d-de8cf92310d1
      responses:
        '200':
          description: Successful completion of operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAisConsentResponse'
        '400':
          $ref: '#/components/responses/ciamErrorResponse'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_invalid_token'
                  - $ref: '#/components/schemas/ciam_error_response'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_client_error'
                  - $ref: '#/components/schemas/ciam_error_response'
        '404':
          $ref: '#/components/responses/ciamErrorResponse'
        # '405':
        #   $ref: '#/components/responses/ciamErrorResponse'
        # '406':
        #   $ref: '#/components/responses/ciamErrorResponse'
        '408':
          $ref: '#/components/responses/ciamErrorResponse'
        '500':
          $ref: '#/components/responses/ciamErrorResponse'
    delete:
      tags:
        - AisConsent
      summary: Delete consent by extended identifier
      security:
        - oAuth2ClientCredentials: [accounts]
      operationId: deleteAisConsent
      parameters:
        - name: consentRef
          in: path
          description: Consent extended identifier
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Successful completion of operation
        '400':
          $ref: '#/components/responses/ciamErrorResponse'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_invalid_token'
                  - $ref: '#/components/schemas/ciam_error_response'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_client_error'
                  - $ref: '#/components/schemas/ciam_error_response'
        # '404':
        #   $ref: '#/components/responses/ciamErrorResponse'
        # '405':
        #   $ref: '#/components/responses/ciamErrorResponse'
        # '406':
        #   $ref: '#/components/responses/ciamErrorResponse'
        '408':
          $ref: '#/components/responses/ciamErrorResponse'
        '500':
          $ref: '#/components/responses/ciamErrorResponse'
  '/accounts':
    get:
      tags:
        - Accounts
      summary: get a list of accounts
      security:
        - oAuth2AuthCode: [accounts]
      description: retrieve list of accounts with information
      operationId: getAccounts
      parameters:
        # - $ref: '#/components/parameters/institutionCode'
        # not supported as cboj will only return non-dormant (active) accounts
        # - $ref: '#/components/parameters/accountStatus'
        # not supported
        # - $ref: '#/components/parameters/accountType'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-interactions-id'
        - $ref: '#/components/parameters/x-idempotency-key'
        - $ref: '#/components/parameters/x-financial-id'
        # - $ref: '#/components/parameters/x-jws-signature'
        - $ref: '#/components/parameters/x-auth-date'
        - $ref: '#/components/parameters/x-customer-id'
        - $ref: '#/components/parameters/x-customer-ip-address'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/getAccounts'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_missing_token'
                  - $ref: '#/components/schemas/error_genericSystemError'
                  - $ref: '#/components/schemas/error_badRequest'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_invalid_token'
                  - $ref: '#/components/schemas/error_unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          description: not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_data_notFound'
                  - $ref: '#/components/schemas/endpoint_notFound'
        '405':
          $ref: '#/components/responses/methodNotAllowed'
        '406':
          $ref: '#/components/responses/notAcceptable'
        '415':
          $ref: '#/components/responses/unsupportedMediaType'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
        '503':
          $ref: '#/components/responses/serviceUnavailable'

  '/accounts/{accountId}':
    get:
      tags:
