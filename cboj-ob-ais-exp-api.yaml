  '/accounts/{accountId}/transactions/{transactionId}':
    get:
      tags:
        - Transactions
      summary: get one transaction information
      security:
        - oAuth2AuthCode: [accounts]
      description: retrieve a specific transaction object
      operationId: getTransaction
      parameters:
        # - $ref: '#/components/parameters/institutionCode'
        - $ref: '#/components/parameters/accountId'
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/x-interactions-id'
        - $ref: '#/components/parameters/x-idempotency-key'
        - $ref: '#/components/parameters/x-financial-id'
        # - $ref: '#/components/parameters/x-jws-signature'
