                  - $ref: '#/components/schemas/error_genericSystemError'
                  - $ref: '#/components/schemas/error_badRequest'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_invalid_token'
                  - $ref: '#/components/schemas/error_unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          description: not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_data_notFound'
                  - $ref: '#/components/schemas/endpoint_notFound'
        '405':
          $ref: '#/components/responses/methodNotAllowed'
        '406':
          $ref: '#/components/responses/notAcceptable'
        '415':
          $ref: '#/components/responses/unsupportedMediaType'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
        '503':
          $ref: '#/components/responses/serviceUnavailable'

  '/accounts/{accountId}/sosp':
    get:
      tags:
        - Standing Orders & Scheduled Payments
      summary: get Standing Orders & Scheduled Payments information
      security:
        - oAuth2AuthCode: [accounts]
      description: retrieve list of Standing Orders & Scheduled Payments
      operationId: getSOSPs
      parameters:
        # - $ref: '#/components/parameters/institutionCode'
        - $ref: '#/components/parameters/accountId'
        # not supported
        # - $ref: '#/components/parameters/SOSPType'
        # - $ref: '#/components/parameters/SOSPStatus'
        # - $ref: '#/components/parameters/SOSPFrequency'
        - $ref: '#/components/parameters/skip'
