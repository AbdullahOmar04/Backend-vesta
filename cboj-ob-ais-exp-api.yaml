  parameters: 
    Authorization:
      name: Authorization
      in: header
      description: Authorization header in which the token is placed
      required: true
      schema:
        type: string
    x-interactions-id:
      name: x-interactions-id
      in: header
      description: Unique id for the interaction, used in all request and responses that are related
      required: true
      schema:
        type: string
        minLength: 1
    x-idempotency-key:
      name: x-idempotency-key
      in: header
      description: Unique id that is generated for each request and response. Used for tracking and to check for duplicate calls
      required: true
      schema:
        type: string
        minLength: 1
    x-financial-id:
      name: x-financial-id
      in: header
      description: Unique id for the Financial Institution; BIC or Pseudo-BIC code of the sender
      required: false
      schema:
        type: string
    x-auth-date:
      name: x-auth-date
      in: header
      description: Date and time of the last authentication of the User by the TPP
      required: false
      schema:
        type: string
    x-jws-signature:
      name: x-jws-signature
      in: header
      description: JWS Signature, refer to security reference
      required: false
      schema:
        type: string
    x-customer-id:
      name: x-customer-id
      in: header
      description: Unique id for the User
      required: false
      schema:
        type: string
    x-customer-ip-address:
      name: x-customer-ip-address
      in: header
      description: The User's IP address if the user is currently logged in with the TPP
      required: false
      schema:
        type: string
    x-customer-user-agent:
      name: x-customer-user-agent
      in: header
      description: Indicates the user-agent the User is using. Helps protecting from comprimised devices
      required: false
      schema:
        type: string
    skip:
      name: skip
      in: query
      description: The number of resources to skip showing in this response. Used for pagination. Used for pagination
      required: false
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      description: The maximum number of resources to return in the response. Used for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    sort:
      name: sort
      in: query
      description: Sorting the response by creation date of the resources (ascending or descending)
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    accountId:
      name: accountId
      in: path
      description: Account id of the user
      required: true
      schema:
        type: string
    accountAddress:
      name: accountAddress
      in: path
      description: Account Address of the user
      required: true
      schema:
        type: string
    accountSchema:
      name: accountSchema
      in: query
      description: Schema of the account address of the user. Currently supports 'IBAN'
      required: true
      schema:
        type: string
        enum:
          - IBAN
    beneficiaryId:
      name: beneficiaryId
      in: path
      description: Beneficiary Id to inquire about
      required: true
      schema:
        type: string
    beneficiaryType:
      name: beneficiaryType
      in: query
      description: Beneficiary Type to inquire about
      required: false
      schema:
        type: string
        enum:
          - Local
          - Internal
          - International
          - Cliq
          - Domestic
    transactionId:
      name: transactionId
      in: path
      description: Transaction id to retrieve
      required: true
      schema:
        type: string
    transactionType:
      name: transactionType
      in: query
      description: Filter by Transaction Type
      required: false
      schema:
        type: string
    instrumentCode:
      name: instrumentCode
      in: query
      description: Filter by Instrument Code to retrieve all transactions made by a specific instrument
      required: false
      schema:
        type: string
    transactionStatus:
      name: status
      in: query
      description: Filter by transaction status
      required: false
      schema:
        type: string
    transactionAmountFrom:
      name: amountFrom
      in: query
      description: Filter by transaction amount. Retrieve transactions with amount starting with this value at minimum
      required: false
      schema:
        type: number
        format: double
        example: 12.00
    transactionAmountTo:
      name: amountTo
      in: query
      description: Filter by transaction amount. Retrieve transactions with amount ending at this value at maximum
      required: false
      schema:
        type: number
        format: double
        example: 15.00
    transactionCurrency:
      name: currency
      in: query
      description: Filter by transaction currency
      required: false
      schema:
        type: string
        format: ISO 4217
    transactionPresentmentFrom:
      name: presentmentDateFrom
      in: query
      description: Filter by transaction Presentment date. The start date of the filter query, to retrieve all transaction from this date onward
      required: false
      schema:
        type: string
        example: "2020-01-01"
    transactionPresentmentTo:
      name: presentmentDateTo
      in: query
      description: Filter by transaction Presentment date. The end date of the filter query, to retrieve all transaction up to this date
      required: false
      schema:
        type: string
        example: "2020-01-01"
    transactionSettlementFrom:
      name: settlementDateFrom
      in: query
      description: Filter by transaction Settlement date. The start date of the filter query, to retrieve all transaction from this date onward
      required: false
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        example: "2020-01-01"
    transactionSettlementTo:
      name: settlementDateTo
      in: query
      description: Filter by transaction Settlement date. The end date of the filter query, to retrieve all transaction up to this date
      required: false
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        example: "2020-01-01"
    transactionDirection:
      name: transactionDirection
      in: query
      description: Filter by transaction Direction; Credit or Debit
      required: false
      schema:
        type: string
        enum:
          - credit
          - debit
    sospId:
      name: sospId
      in: path
      description: Standing Order & Scheduled Payment id to retrieve
      required: true
      schema:
        type: string
