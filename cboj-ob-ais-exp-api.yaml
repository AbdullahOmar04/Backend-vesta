        - $ref: '#/components/parameters/transactionAmountTo'
        # - $ref: '#/components/parameters/transactionCurrency'
        # - $ref: '#/components/parameters/transactionPresentmentFrom'
        # - $ref: '#/components/parameters/transactionPresentmentTo'
