components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /ob/oauth2/token
          scopes:
            accounts: read customer's account information
    oAuth2AuthCode:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /ob/web/login
          tokenUrl: /ob/oauth2/token
          scopes:
            accounts: read customer's account information
  schemas:
    AisStatus:
      type: string
      description: The current status of the consent.
      enum:
        - New
        - Active
        - Rejected
        - Revoked
        - Expired
      example: New
    AisPermissions:
      type: array
      description: List of account permissions granted by the consent.
      items:
        type: string
        enum:
          - ReadAccounts
          - ReadBalances
          - ReadStandingOrders&ScheduledPayments
          - ReadBeneficiaries
          - ReadTransactions
      uniqueItems: true
      example:
        - "ReadAccounts"
        - "ReadBalances"
        - "ReadStandingOrders&ScheduledPayments"
        - "ReadBeneficiaries"
        - "ReadTransactions"
    ClientTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "sgQ336T7LBRDLOEfWGByM9pftvQ"
        expires_in:
          type: integer
          example: 300
        refresh_expires_in:
          type: integer
          example: 0
        token_type:
          type: string
          example: "Bearer"
        not-before-policy:
          type: integer
          example: 0
        scope:
          type: string
          example: ""
    CreateAisConsentRequest:
      required:
        - transactionFromDateTime
        - transactionToDateTime
      type: object
      properties:
        transactionFromDateTime:
          type: string
          description: Account transactions start date with time.
          format: date-time
          example: 2000-01-01T00:00:00+00:00
        transactionToDateTime:
          type: string
          description: Account transactions end date with time.
          format: date-time
          example: 2052-12-02T00:00:00+00:00
        permissions:
          $ref: '#/components/schemas/AisPermissions'
      description: Account consent
    CreateConsentResponse:
      type: object
      description: Create consent response
      required:
        - consentRef
        - status
        - createDateTime
        - updateDateTime
        - expirationDateTime
        - transactionFromDateTime
        - transactionToDateTime
        - permissions
        - loginUrls
      properties:
        consentRef:
          type: string
          format: uuid
          description: AIS consent external identifier.
          example: 23b1600c-ec0b-4e4f-97e7-ab65b99787e7
        status:
          $ref: '#/components/schemas/AisStatus'
        createDateTime:
          type: string
          description: The date with time of the consent creation.
          format: date-time
          example: 2024-06-02T09:30:17+00:00
        updateDateTime:
          type: string
          description: The date with time of the last consent attributes update.
          format: date-time
          example: 2024-06-02T09:30:17+00:00
        expirationDateTime:
          type: string
          description: The date with time until the consent is considered valid.
          format: date-time
          example: 2024-12-02T00:00:00+00:00
        transactionFromDateTime:
          type: string
          description: Account transactions start date with time.
          format: date-time
          example: 2000-01-01T00:00:00+00:00
        transactionToDateTime:
          type: string
          description: Account transactions end date with time.
          format: date-time
          example: 2052-12-02T00:00:00+00:00
        permissions:
          $ref: '#/components/schemas/AisPermissions'
        loginUrls:
          type: array
          items:
            type: string
          example:
            - "https://{hostname}/ob/web/login?consentRef={consentRef}"
          description: A list of possible login page URLs.
    AccountItem:
      type: object
      properties:
        number:
          type: string
          description: Account number.
          example: "00234124345693023"
        currency:
          type: string
          description: Account currency.
          example: JOD
      description: Account consent representation for mobile
    GetAisConsentResponse:
      type: object
      description: Account information services consent data.
      required: 
        - consentRef
        - status
        - createDateTime
        - updateDateTime
        - expirationDateTime
        - transactionFromDateTime
        - transactionToDateTime
        - permissions
      properties:
        consentRef:
          type: string
          format: uuid
          description: AIS consent external identifier.
          example: 23b1600c-ec0b-4e4f-97e7-ab65b99787e7
        status:
          $ref: '#/components/schemas/AisStatus'
        createDateTime:
          type: string
          description: The date with time of the consent creation.
          format: date-time
          example: 2024-06-02T09:30:17+00:00
        updateDateTime:
          type: string
          description: The date with time of the last consent attributes update.
          format: date-time
          example: 2024-06-02T09:30:17+00:00
        expirationDateTime:
          type: string
          description: The date with time until the consent is considered valid.
          format: date-time
          example: 2024-12-02T00:00:00+00:00
        transactionFromDateTime:
          type: string
          description: Account transactions start date with time.
          format: date-time
          example: 2000-01-01T00:00:00+00:00
        transactionToDateTime:
          type: string
          description: Account transactions end date with time.
          format: date-time
          example: 2052-12-02T00:00:00+00:00
        permissions:
          $ref: '#/components/schemas/AisPermissions'

## AIS API objects
    account:
      type: object
      required: 
        - accountId
        - status
        - mainRoute
        - accountType
        - currencies
        - institutionBasicInfo
        - branchBasicInfo
        - openingDate
        - isSharedAccount
      properties:
        accountId:
          type: string
          pattern: '^[0-9]{7,}$'
          example: '1234567'
        status:
          type: string
          format: str
          example: ACTIVE
        # statusUpdateDateTime:
        #   $ref: '#/components/schemas/dateTime'
        mainRoute:
          $ref: '#/components/schemas/routeComplexType'
        accountType:
          type: object
          properties:
            code:
              type: string
              format: str
              example: "1101"
            name:
              type: string
              format: str
              example: "Regular-Current"
        currencies:
          type: string
          format: ISO 4217
          example: JOD
        institutionBasicInfo:
          $ref: '#/components/schemas/institutionBasicInfoComplexType'
        branchBasicInfo:
          $ref: '#/components/schemas/branchBasicInfoComplexType'
        openingDate:
          $ref: '#/components/schemas/dateTime'
        isSharedAccount:
          type: boolean
          example: false
        lockedForDebit:
          type: boolean
          example: true
        availableBalance:
          $ref: '#/components/schemas/amountComplexType'
    beneficiaries:
      type: object
      required: 
        - beneficiaryId
        - beneficiaryType
        - accountBasicInfo
      properties:
        beneficiaryId:
          type: string
          format: str
          example: "1001"
        beneficiaryType:
          type: string
          enum:
            - Local
            - Internal
            - International
            - Cliq
            - Domestic
          format: str
          example: Local
        beneficiaryName:
          type: string
          format: str
          example: SWG
        beneficiaryNickname:
          type: string
          format: str
          example: SWG charity account
        institutionBasicInfo:
          $ref: '#/components/schemas/institutionBasicInfoComplexType'
        accountBasicInfo:
          $ref: '#/components/schemas/accountBasicInfoComplexType'
    balances:
      type: object
      required: 
        - availableBalance
        - currentBalance
        - creditlimit
        - amortisedLimit
      properties:
        availableBalance:
          $ref: '#/components/schemas/amountComplexType'
        currentBalance:
          $ref: '#/components/schemas/amountComplexType'
        creditlimit:
          $ref: '#/components/schemas/amountComplexType'
        amortisedLimit:
          $ref: '#/components/schemas/amountComplexType'
    transactions:
      type: object
      required:
        - transactionId
        - transactionType
        - status
        - amount
        - settlementDateTime
        - presentementDateTime
        - transactionDirection
      properties:
        transactionId:
          type: string
          example: "206225498211001.010001"
        transactionType:
          type: string
          description: transaction type description
          example: Account Transaction
        status:
          type: string
          format: str
          example: 'accepted'
        # transactionReferences:
        #   type: array
        #   description: List of transaction references that could be ids of the transaction, message, instruction, or such
        #   items: 
        #     type: object
        #     properties:
        #       code:
        #         type: string
        #         example: msgId
        #       desc:
        #         type: string
        #         example: str123
        amount:
          $ref: '#/components/schemas/amountComplexType'
        # transactionTypeCode:
        #   type: object
        settlementDateTime:
          $ref: '#/components/schemas/dateTime'
        presentementDateTime:
          $ref: '#/components/schemas/dateTime'
        # charges:
        #   $ref: '#/components/schemas/amountComplexType'
        #   description: Charges and fees of this transaction
        transactionDirection:
          type: string
          enum:
          - credit
          - debit
          example: debit
    SOSP:
      type: object
      required:
        - sospId
        - sospType
        - sospStatus
        - sospNickname
        - sospBeneficiary
        - paymentSchedule
      properties:
        sospId:
          type: string
          example: "5005811.1"
        sospType:
          type: string
          example: Account Transfer
        sospStatus:
          type: string
          example: active
        sospNickname:
          type: string
          example: Account Transfer
        sospBeneficiary:
          type: object
          properties:
            accountBasicInfo:
              $ref: '#/components/schemas/accountBasicInfoComplexType'
        paymentSchedule:
          type: object
          required:
            - frequencyInfo
            - numberOfCompletedPayments
            - remainingPayments
            - firstPaymentDateTime
            - finalPaymentDateTime
          properties:
            frequencyInfo:
              type: object
              required:
                - frequency
                - setNumberOfPayments
                - setAmount
                - expirationDate
              properties:
                frequency:
                  type: string
                  format: str
                  example: monthly
                setNumberOfPayments:
                  type: integer
                  format: int32
                  example: 12
                setAmount:
                  $ref: '#/components/schemas/amountComplexType'
                expirationDate:
                  $ref: '#/components/schemas/dateTime'
            numberOfCompletedPayments:
              type: number
              format: int32
              example: 2
            remainingPayments:
              type: number
              format: int32
              example: 10
            firstPaymentAmount:
              $ref: '#/components/schemas/amountComplexType'
            firstPaymentDateTime:
              $ref: '#/components/schemas/dateTime'
              example: 2025-09-15T10:30:00Z
            finalPaymentDateTime:
              $ref: '#/components/schemas/dateTime'
              example: 2026-08-15T10:30:00Z
    amountComplexType:
      type: object
      required: 
        - amount
        - currency
      properties:
        amount:
          type: number
          format: float
          example: 25.001
        currency:
          type: string
          format: ISO 4217
          example: JOD
    routeComplexType:
      type: object
      required: 
        - schema
        - address
      properties:
        schema:
          type: string
          format: str
          example: IBAN
        address:
          type: string
          format: str
          example: JO27CBJO0010000000000000000001
    name:
      type: object
      required: 
        - enName
      properties:
        enName:
          type: string
          format: str
          example: "Capital Bank of Jordan"
    nameComplexType:
      type: object
      allOf:
        - $ref: '#/components/schemas/name'
        - type: object
      # properties:
      #   tradeName:
      #     $ref: '#/components/schemas/name'
    institutionBasicInfoComplexType:
      type: object
      required: 
        - institutionType
        - institutionIdentification
        - name
      properties:
        institutionType:
          type: string
          format: str
          example: BANK
        institutionIdentification:
          allOf:
          - $ref: '#/components/schemas/routeComplexType'
          - type: object
          properties:
            schema:
              example: bicCode
            address:
              example: EFBKJOAM
        name:
          $ref: '#/components/schemas/nameComplexType'
        # institutionPhoneNumber:
        #   $ref: '#/components/schemas/phoneNumber'
    branchBasicInfoComplexType:
      type: object
      required: 
        - branchIdentification
        - name
      properties:
        branchIdentification:
          allOf:
          - $ref: '#/components/schemas/routeComplexType'
          - type: object
          properties:
            schema:
              example: branchCode
            address:
              example: JO0010009
        name:
          $ref: '#/components/schemas/nameComplexType'
        # branchPhoneNumber:
        #   $ref: '#/components/schemas/phoneNumber'
    accountBasicInfoComplexType:
      type: object
      required: 
        - accountId
        - mainRoute
      properties:
        accountId:
          type: string
          format: str
          example: str123
        mainRoute:
          $ref: '#/components/schemas/routeComplexType'
    routingsComplexType:
      type: array
      items:
        allOf:
        - $ref: '#/components/schemas/routeComplexType'
        - type: object
        properties:
          schema:
            example: CLIQ
          address:
            example: HSM
    dayComplexType:
      type: object
      properties:
        isWorkingDay:
          type: boolean
          example: true
        openingTime:
          type: string
          format: time(HH:mm)
          example: '10:00'
        closingTime:
          type: string
          format: time(HH:mm)
          example: '18:00'
        secondOpeningTime:
          type: string
          format: time(HH:mm)
          example: '19:00'
        secondClosingTime:
          type: string
          format: time(HH:mm)
          example: '23:00'
    workingHoursComplexType:
      type: object
      properties:
        sunday:
          $ref: '#/components/schemas/dayComplexType'
        monday:
          $ref: '#/components/schemas/dayComplexType'
        tuesday:
          $ref: '#/components/schemas/dayComplexType'
        wednesday:
