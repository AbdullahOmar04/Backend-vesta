        - $ref: '#/components/parameters/x-financial-id'
        # - $ref: '#/components/parameters/x-jws-signature'
        - $ref: '#/components/parameters/x-auth-date'
        - $ref: '#/components/parameters/x-customer-id'
        - $ref: '#/components/parameters/x-customer-ip-address'
        - $ref: '#/components/parameters/x-customer-user-agent'
