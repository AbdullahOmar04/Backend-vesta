openapi: 3.0.1
info:
  title: Accounts API
  description: API allows managing Bank accounts for a third-party partner application
  version: '1'

security:
  - bearerAuth: []

tags:
  - name: customers
  - name: accounts
  - name: other

servers:
  - url: https://api.developer.bankaletihad.com/api/v1/partner/accounts
paths:
  /customers:
    get:
      tags:
        - customers
      description: Returns all available for the partner customers and their accounts
      operationId: list-all-customers
      parameters:
        - name: userId
          in: query
          description: |
            The unique Id of the user
          schema:
            type: string
        - name: pageNumber
          in: query
          description: |
            The number of page
          schema:
            type: integer
            minimum: 1
            maximum: 4000000
            default: 1
        - name: pageSize
          in: query
          description: |
            The number of items for page
          schema:
            type: integer
            minimum: 10
            maximum: 500
            default: 50
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Range:
              schema:
                type: string
              description: Pagination details
              example: 0-19/4125
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accountList'
              example:
                - Customer: e49423a3-bb08-477c-a5fb-d9d6539c8466
                  User: e49423a3-bb08-477c-a5fb-d9d6539c8467
                  Accounts:
                    - '0010100067615101'

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "400001"
                Message: '{field} has an invalid value'
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "401003"
                Message: The access token provided is expired, revoked, malformed, or invalid for other reasons
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "403004"
                Message: Resource owner authentication failed
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "500001"
                Message: Internal Server Error
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

  /customers/{customerId}/accounts:
    get:
      tags:
        - accounts
      description: Returns all accounts for the specified customer
      operationId: list-all-customer's-accounts
      parameters:
        - name: customerId
          in: path
          description: The unique Id of the customer
          required: true
          schema:
            type: string
        - name: pageNumber
          in: query
          description: |
            The number of page
          schema:
            type: integer
            minimum: 1
            maximum: 4000000
            default: 1
        - name: pageSize
          in: query
          description: |
            The number of items for page
          schema:
            type: integer
            minimum: 10
            maximum: 500
            default: 50
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Range:
              schema:
                type: string
              description: Pagination details
              example: 0-19/4125
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts'
              example:
                - Branch: '001'
                  Number: '0010100067615101'
                  Type: "3101"
                  AlternateNumber: null
                  Name: John Wick Savings Account
                  BankName: BANK ALETIHAD
                  Customer:
                    Name: John Wick
                    FullName: John Wick
                    Type: INDIVIDUAL
                  CurrencyCode: JOD
                  NoDebit: false
                  NoCredit: false
                  Dormant: false
                  CurrentBalance: 127370834.236
                  LocalCurrencyCurrentBalance: 127370834.236
                  BlockedAmount: 0.000
                  AvailableBalance: 127370834.236
                  IBAN: JO47UBSI1010000010100067615101
                  SWIFT: UBSIJOAX
                - Branch: '001'
                  Number: '0010100067615102'
                  Type: "3101"
                  AlternateNumber: null
                  Name: John Wick Savings Account
                  BankName: BANK ALETIHAD
                  Customer:
                    Name: John Wick
                    FullName: John Wick
                    Type: INDIVIDUAL
                  CurrencyCode: JOD
                  NoDebit: false
                  NoCredit: false
                  Dormant: false
                  CurrentBalance: 1.236
                  LocalCurrencyCurrentBalance: 1.236
                  BlockedAmount: 0.000
                  AvailableBalance: 1.236
                  IBAN: JO47UBSI1010000010100067615102
                  SWIFT: UBSIJOAX


        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "400001"
                Message: '{field} has an invalid value'
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "401003"
                Message: The access token provided is expired, revoked, malformed, or invalid for other reasons
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "403004"
                Message: Resource owner authentication failed
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "404001"
                Message: Customer not found
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "500001"
                Message: Internal Server Error
                DateTime: "2020-05-14T21:12:03"
                RequestId: "0786d365-2ea1-4dd6-8d9f-ef3d1af429dd"
    post:
      tags:
        - accounts
      description: Opens a new account for the customer
      operationId: create-an-account
      parameters:
        - name: customerId
          in: path
          description: Id of the customer
          required: true
          schema:
            type: string
        - name: Idempotency-key
          in: header
          description: |
            The unique value should be specified on each new request to API. If you are uncertain about the execution result of the recently made request, you may repeat the request with the same content and the same idempotency key, it should give you the same response as it should have been for the previous request, but without actual request execution. It can be useful if you did not get a response to your request at all or received the timeout error.
          required: true
          schema:
            pattern: ^\S+(.*\S+)*$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/newAccount'
            example:
              Currency: JOD
              Name: John Wick Savings Account
        required: true
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
              example:
                Branch: '001'
                Number: '0010100067615101'
                Type: "3101"
                AlternateNumber: null
                Name: John Wick Savings Account
                BankName: BANK ALETIHAD
                Customer:
                  Name: John Wick
                  FullName: John Wick
                  Type: INDIVIDUAL
                CurrencyCode: JOD
                NoDebit: false
                NoCredit: false
                Dormant: false
                CurrentBalance: 127370834.236
                LocalCurrencyCurrentBalance: 127370834.236
                BlockedAmount: 0.000
                AvailableBalance: 127370834.236
                IBAN: JO47UBSI1010000010100067615101
                SWIFT: UBSIJOAX

        '400':
          description: Bad request
          content:
