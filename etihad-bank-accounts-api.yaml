    delete:
      tags:
        - accounts
      description: Closes the customer's bank account
      operationId: close-an-account
      parameters:
        - name: customerId
          in: path
          description: The unique Id of the customer
          required: true
          schema:
            type: string
        - name: accountNumber
          in: path
          description: Bank account number of the customer
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/closeAccount'
            example:
              CreditAccountNumber: '0010100067615101'
        required: true
      responses:
        '204':
          description: Successful operation
          content: {}

        '400':
