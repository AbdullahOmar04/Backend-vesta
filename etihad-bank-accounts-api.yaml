  /customers/{customerId}/payments/exchangeRates:
    get:
      tags:
        - customers
      description: Retrieve exchange rate
      operationId: get-a-exchange-rate
      parameters:
        - name: customerId
          in: path
          description: Id of the customer
          required: true
          schema:
            type: string
        - name: fromCurrencyCode
          in: query
          description: |
            Represents the ISO3 currency code of the customer account
          required: true
          schema:
            type: string
        - name: toCurrencyCode
          in: query
          description: |
            Represents the ISO3 currency code of the beneficiary account
          required: true
          schema:
            type: string
        - name: fromCurrencyAmount
          in: query
          description: |
            Represents the transfer amount
          required: true
          schema:
            type: string
        - name: customerAccount
          in: query
          description: |
            Bank Account number of the customer to be used as a source of funds for the transfer
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: |
            Type of operation
          required: true
          example: CREDIT, DEBIT
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ExchangeRate:
                    type: number
                    description: Represents the exchange rate for the currency pair provided in the request
                  ExchangedAmount:
                    type: number
                    description: Represents the amount calculated based on the exchange rate
              example:
                ExchangeRate: 0.9632983
                ExchangedAmount: 4816.49
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                Code: "400001"
                Message: '{field} has an invalid value'
                DateTime: "2020-05-14T21:12:03"
